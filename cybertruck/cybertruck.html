<title>CYBERTRUCK 충전 모니터링</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2832;--muted:#aab7c1;--green:#46d39a;--line:#33434f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#182630,#0d141a 70%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f7f9}
main{max-width:560px;margin:auto;padding:20px 16px 36px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 16px;gap:10px}
.brand{font-size:20px;font-weight:750;letter-spacing:.08em}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.pill{border:1px solid #27694f;background:#163b30;color:#8cf0c1;border-radius:30px;padding:7px 11px;font-size:12px;white-space:nowrap}
.car{width:100%;display:block;border-radius:18px;background:#fff;object-fit:contain;aspect-ratio:16/9}
.panel{background:rgba(27,40,50,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 12px 30px #0002}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.label{color:var(--muted);font-size:13px}.percent{font-size:42px;font-weight:750;letter-spacing:-.04em}
.bar{height:11px;border-radius:20px;background:#34434d;overflow:hidden;margin:13px 0 8px}.fill{height:100%;width:0;background:linear-gradient(90deg,#25a879,#69e3ae);border-radius:20px;transition:width .4s}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.metric{background:#22313c;border-radius:13px;padding:13px}.metric strong{display:block;font-size:19px;margin-top:5px}
.section-title{font-size:14px;font-weight:700;margin-bottom:10px}
.code{font-size:24px;font-weight:750;letter-spacing:.04em}.warning{color:#ffd28a;font-size:11px;border:1px solid #70552d;border-radius:20px;padding:5px 8px;display:inline-block;margin-bottom:9px}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}
.connection{display:flex;align-items:center;gap:8px;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#46d39a;box-shadow:0 0 10px #46d39a}
.dot.off{background:#ff6868;box-shadow:0 0 10px #ff6868}
footer{text-align:center;color:#81909a;font-size:11px;padding:18px 4px}
</style>
</head>

let seenOnline=false,baseElapsed=0,receivedAt=0,lastShownElapsed=0;

  if(!d || typeof d.updatedAt==='undefined'){if(seenOnline)disconnected();else waiting();return;}
  const updatedAt=Number(d.updatedAt),age=Date.now()-updatedAt;
  const online=d.esp32Online===true && Number.isFinite(updatedAt) && age>=-10000 && age<=5000;
  if(!online){if(seenOnline)disconnected();else waiting();return;}
  seenOnline=true;
  const pct=Math.max(0,Math.min(100,Number(d.percent)||0));
  const newElapsed=Math.max(0,Number(d.elapsedSeconds)||0);
  baseElapsed=Math.max(lastShownElapsed,newElapsed);
  receivedAt=performance.now();lastShownElapsed=baseElapsed;
  const complete=d.complete===true;
  $('percent').textContent=pct+'%';$('progress').style.width=pct+'%';
  $('remaining').textContent=complete?'완료':fmt(d.remainingSeconds||0);
  $('chargeState').textContent=complete?'충전 완료':'충전 중';
  $('stateText').textContent=complete?'충전이 완료되었습니다':'충전 진행 중';
  $('dtc').textContent=d.dtc||'----';
  $('dtcText').textContent=(d.dtcText||'진단 코드 설명')+' · 테스트용 임의 고장 코드';
  $('connection').textContent='Firebase 데이터 수신';$('dot').classList.remove('off');
  $('lastUpdate').textContent='마지막 수신: '+new Date(updatedAt).toLocaleTimeString('ko-KR');
  updateElapsed();
 }catch(e){if(seenOnline)disconnected();else waiting();}
}
function updateElapsed(){
 if(!seenOnline||!receivedAt)return;
 const seconds=baseElapsed+Math.floor((performance.now()-receivedAt)/1000);
 lastShownElapsed=Math.max(lastShownElapsed,seconds);
 $('elapsed').textContent=fmt(lastShownElapsed);
}
waiting();refresh();
setInterval(refresh,500);
setInterval(updateElapsed,1000);
</script>
